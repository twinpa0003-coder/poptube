name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Gradle Wrapper 바이너리를 리포에 넣지 않아도 되도록 Gradle 을 직접 설치한다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      # 고정 서명키. 이게 없으면 매 빌드마다 서명이 달라져서 기존 앱 위에 설치가 안 된다.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 시크릿이 없습니다. 서명이 매번 달라져 업데이트 설치가 실패합니다."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/poptube.p12
          echo "키스토어 복원 완료 ($(stat -c%s android/app/poptube.p12) bytes)"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Remove keystore
        if: always()
        run: rm -f android/app/poptube.p12

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk poptube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: poptube-apk
          path: poptube.apk
          if-no-files-found: error

      # 폰에서 바로 받을 수 있는 고정 주소를 만든다.
      #   https://github.com/<owner>/<repo>/releases/latest/download/poptube.apk
      # 아티팩트와 달리 로그인이 필요 없고 zip 이 아니라 APK 그대로 내려받아진다.
      - name: Update rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드
          body: |
            `main` 브랜치 최신 커밋 자동 빌드입니다.

            - 커밋: ${{ github.sha }}
            - 빌드: ${{ github.run_number }}회차

            아래 `poptube.apk` 를 폰에서 받아 설치하세요.
          files: poptube.apk
          make_latest: true

      - name: Attach to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: poptube.apk
          generate_release_notes: true
